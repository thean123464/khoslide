{% extends "base.html" %}
{% block content %}
<section class="admin-page"><div class="container" style="max-width:520px;margin:70px auto">
  <div class="admin-card">
    <div class="eyebrow dark">KHU VỰC QUẢN TRỊ</div>
    <h1>Đăng nhập quản trị</h1>
    <p style="color:#666">Khu vực này chỉ dành cho chủ cửa hàng.</p>
    {% if error %}<div style="padding:12px 14px;border-radius:10px;background:#fff0f0;color:#b42318;margin:18px 0">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Tên đăng nhập</label>
      <input name="username" autocomplete="username" required>
      <label>Mật khẩu</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Đăng nhập</button>
    </form>
  </div>
</div></section>
{% endblock %}
