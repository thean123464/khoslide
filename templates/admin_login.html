<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — KhoSlide</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><div class="container"><div class="form-card" style="max-width:460px;margin-top:90px"><a class="logo" href="{{ url_for('index') }}"><span class="logo-mark">K</span>KhoSlide</a><h1>Đăng nhập quản trị</h1>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label>Tài khoản</label><input name="username" required></div><div class="form-group"><label>Mật khẩu</label><input type="password" name="password" required></div><button class="btn btn-primary" style="width:100%">Đăng nhập</button></form></div></div></body></html>
