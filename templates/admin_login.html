{% extends "base.html" %}
{% block title %}Đăng nhập quản trị — KhoSlide{% endblock %}
{% block content %}
<section class="section narrow"><div class="form-card"><div class="badge">ADMIN</div><h1>Đăng nhập quản trị</h1>{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Tên đăng nhập<input name="username" required autocomplete="username"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary btn-wide" type="submit">Đăng nhập</button></form></div></section>
{% endblock %}
